name: docs-reindex

# Corpus adquirido é privado e ignorado. Este workflow só roda manualmente ou
# em agenda, sobre as fixtures/artefatos autorizados presentes no checkout.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 0"

permissions:
  contents: read

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install pinned integration
        run: python -m pip install --disable-pip-version-check -e ".[rag]"
      - name: Plan
        run: python scripts/update_rag.py plan
      - name: Apply with checkpoints
        run: python scripts/update_rag.py apply
      - name: Status
        run: python scripts/update_rag.py status
