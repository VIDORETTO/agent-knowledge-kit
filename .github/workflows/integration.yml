name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

jobs:
  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin installer
        run: python -m pip install --disable-pip-version-check --upgrade "pip==26.2.1"
      - name: Install RAG integration
        run: python -m pip install --disable-pip-version-check -e ".[dev,formats,rag]"
      - name: Build synthetic package
        run: python -m docops run documents/fixtures/acme-docs --output artifacts/acme --slug acme --license MIT
      - name: Validate package
        run: python -m docops validate artifacts/acme --json
      - name: MCP smoke
        run: python scripts/mcp_smoke.py "authentication retries"
      - name: Concurrent search during reindex
        run: python scripts/test_reindex_concurrency.py --package artifacts/acme
