name: Bug report
description: Report a reproducible defect in a supported profile
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private documents, indexes, model caches, tokens or credentials.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Candidate version or exact commit tested.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and support profile.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact sanitized command and minimal synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
